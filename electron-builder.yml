appId: app.mangolauncher.mango
productName: Mango Launcher
directories:
  buildResources: build
fileAssociations:
  - ext: mangocds
    name: Mango Custom Download Source
    description: Mango Launcher custom download source
    mimeType: application/x-mango-custom-download-source
extraResources:
  - ludusavi
  - mango-python-rpc
  - mango-native
  - seeds
  - from: node_modules/create-desktop-shortcuts/src/windows.vbs
  - from: resources/achievement.wav
files:
  - "!**/.vscode/*"
  - "!.venv*/**"
  - "!src/*"
  - "!native/mango-native/target"
  - "!native/mango-native/target/**"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.test.json}"
  - "!scripts/register-ts-node.mjs"
asarUnpack:
  - resources/**
  - node_modules/sharp/**
  - node_modules/@img/sharp-libvips-*/**
win:
  executableName: MangoLauncher
  extraResources:
    - from: binaries/7z.exe
    - from: binaries/7z.dll
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: installer.nsh
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: binaries/7zz
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  extraResources:
    - from: binaries/7zzs
    - from: binaries/umu/umu-run
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  artifactName: ${name}-${version}.${ext}
  maintainer: fraa2a
  category: Game
  mimeTypes:
    - x-scheme-handler/mangolauncher
    - application/x-mango-custom-download-source
npmRebuild: false
publish:
  provider: github
  owner: fraa2a
  repo: mango-launcher
  releaseType: release
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
